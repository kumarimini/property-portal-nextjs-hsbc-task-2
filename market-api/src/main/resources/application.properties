spring.application.name=market-api
server.port=8080
server.error.include-message=always

# Caching: in-memory Caffeine, at most 500 entries, each expires after 10 minutes
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=10m

# Used in Step 7
model.api.url=http://127.0.0.1:8000

# Which websites may call this API from a browser
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000